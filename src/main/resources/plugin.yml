name: ShardSMP
version: 1.0.0
main: com.shardsmp.ShardSMP
api-version: '1.20'
author: ShardSMP
description: Elemental Catalysts and Prismarine Shards with passive and active abilities.

commands:
  catalyst:
    description: Give catalysts and shards, list elements, reload config.
    usage: /catalyst <give|list|reload>
    permission: shardsmp.admin
    aliases: [cat]

permissions:
  shardsmp.admin:
    description: Use /catalyst admin subcommands.
    default: op
  shardsmp.use:
    description: Use catalyst abilities and passives.
    default: true
